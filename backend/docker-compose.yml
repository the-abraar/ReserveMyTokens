services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: rmt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell or .env}
      POSTGRES_DB: reserve_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://rmt:${POSTGRES_PASSWORD}@db:5432/reserve_db
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    depends_on:
      - db
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
