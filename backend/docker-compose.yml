services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: rmt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell or .env}
      POSTGRES_DB: reserve_db
    healthcheck:  # api runs migrations at start, so it must wait for a ready database
      test: ["CMD-SHELL", "pg_isready -U rmt -d reserve_db"]
      interval: 2s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://rmt:${POSTGRES_PASSWORD}@db:5432/reserve_db
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-rmt-web}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
