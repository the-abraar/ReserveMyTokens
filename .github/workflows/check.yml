name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci
      - run: scripts/check.sh
  postgres:  # the backend suite on Postgres too: SKIP LOCKED, row locks and settle races only run there
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15
        env: { POSTGRES_USER: rmt, POSTGRES_PASSWORD: ci-throwaway, POSTGRES_DB: rmt_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U rmt -d rmt_test" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://rmt:ci-throwaway@localhost:5432/rmt_test  # fixture drops its schema per test
      PYTHONPATH: ${{ github.workspace }}/worker/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r backend/requirements-dev.txt "click>=8" "requests>=2.25" "keyring>=24" "cryptography>=42"
      - run: cd backend && pytest -q && pytest -q $(ls tests/test_*.py | sort -r)
